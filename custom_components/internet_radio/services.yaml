push_station:
  name: 推送电台
  description: 按台名（模糊匹配）或 contentId 推送一个云听电台到音响播放。
  fields:
    station:
      name: 电台
      description: 台名（支持模糊匹配，如「中国之声」「交通」）或 contentId。
      required: true
      example: 中国之声
      selector:
        text:
    entity_id:
      name: 目标播放器
      description: 不填则推给所有本集成添加的播放器。
      selector:
        entity:
          domain: media_player
          integration: internet_radio

add_favorite:
  name: 收藏电台
  fields:
    station:
      name: 电台
      required: true
      example: 中国之声
      selector:
        text:

remove_favorite:
  name: 取消收藏
  fields:
    station:
      name: 电台
      description: 台名或 contentId。
      required: true
      selector:
        text:

clear_recent:
  name: 清空最近播放

reboot:
  name: 重启音响
  description: 给所有云听电台设备下发重启指令（不经按钮的二次确认，给自动化用）。

shutdown:
  name: 关闭音响
  description: 给所有云听电台设备下发关机指令（不经按钮的二次确认，给自动化用）。设备会断电，需要手动开机。

rediscover:
  name: 重新发现设备
  description: 按 UDN 在局域网里重新搜索所有设备的地址，搜到就回写配置项（设备换 IP/端口后用）。返回每台设备搜到的地址，没搜到为 null。
